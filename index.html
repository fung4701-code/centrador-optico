<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centrador Pro - Estable</title>
    <style>
        :root { --bg-color: #2b2b2d; --panel-bg: #1c1c1e; --text-main: #f5f5f7; --accent: #ffd60a; --border-color: #38383a; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); user-select: none; overflow: hidden; }
        
        /* ====== MENÚ PRINCIPAL ====== */
        #pantallaMenu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; box-sizing: border-box; text-align: center;
        }
        .logo-app { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .logo-app span { color: var(--accent); }
        .sub-logo { color: #86868b; font-size: 16px; margin-bottom: 40px; }
        .btn-menu {
            width: 100%; max-width: 350px; padding: 20px; margin-bottom: 15px; border-radius: 12px;
            font-size: 18px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .btn-menu-completo { background-color: #007aff; color: white; }
        .btn-menu-rapido { background-color: #3a3a3c; color: white; }
        .btn-menu span { font-size: 13px; font-weight: normal; opacity: 0.8; }
        /* ============================ */

        .header { padding: 15px; font-size: 18px; border-bottom: 1px solid var(--border-color); background: var(--bg-color); display: flex; justify-content: space-between;}
        .main-container { display: flex; flex-direction: column; height: calc(100vh - 50px); }
        
        .panel-izquierdo { flex: 1.2; display: flex; justify-content: center; align-items: center; background: #000; position: relative; overflow: hidden; }
        video, canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; }
        
        .hud-guias { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .hud-oval { width: 55%; max-width: 220px; height: 50%; max-height: 320px; border: 2px dashed rgba(255, 214, 10, 0.6); border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; position: absolute; transition: all 0.3s; }
        .hud-linea-h { width: 80%; height: 1px; border-top: 1px solid rgba(255, 255, 255, 0.4); position: absolute; top: 38%; transition: all 0.3s; }
        .hud-linea-v { width: 1px; height: 80%; border-left: 1px dashed rgba(255, 255, 255, 0.3); position: absolute; transition: all 0.3s; }
        .hud-alerta { position: absolute; top: 5%; padding: 8px 15px; background: rgba(0,0,0,0.6); border-radius: 20px; color: var(--accent); font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; }

        .panel-derecho { flex: 1; padding: 15px; background: var(--panel-bg); overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        #info { background: #2c2c2e; padding: 12px; border-radius: 8px; font-size: 14px; border-left: 4px solid var(--accent); line-height: 1.4; }
        
        .controles { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
        button { flex: 1; padding: 14px 10px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; min-width: 120px; transition: background 0.3s;}
        .btn-primario { background-color: #007aff; color: white; }
        .btn-accion { background-color: var(--accent); color: #000; display: none; }
        .btn-secundario { background-color: #3a3a3c; color: white; display: none; }
        .btn-linterna { background-color: #3a3a3c; color: white; display: none; }
        .btn-linterna.activa { background-color: var(--text-main); color: #000; }

        .seccion-datos { display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 15px;}
        th, td { padding: 8px 5px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { color: #86868b; font-weight: normal; font-size: 12px; }
        td:first-child { text-align: left; color: #86868b; font-weight: bold; width: 25%; }
        tr.total td { border-top: 1px solid #86868b; font-weight: bold; color: white; }
        
        @media (min-width: 600px) and (orientation: landscape) {
            .main-container { flex-direction: row; }
            .panel-izquierdo { flex: 1.5; border-right: 1px solid var(--border-color); }
            .panel-derecho { flex: 1; }
        }
    </style>
</head>
<body>

<!-- PANTALLA MENÚ -->
<div id="pantallaMenu">
    <div class="logo-app">i.Terminal <span>Pro</span></div>
    <div class="sub-logo">Biometría Óptica Digital</div>
    
    <button id="btnModoCompleto" class="btn-menu btn-menu-completo">
        Biometría Completa
        <span>Frente + Perfil (Lentes Progresivos)</span>
    </button>
    <button id="btnModoRapido" class="btn-menu btn-menu-rapido">
        Biometría Rápida
        <span>Solo Frente (Visión Sencilla)</span>
    </button>
</div>

<!-- PANTALLA APLICACIÓN -->
<div id="pantallaApp" style="display: none;">
    <div class="header">
        <span>i.Terminal Pro</span>
        <span id="faseTitulo" style="color: var(--accent);">Fase 0: Foto Frontal</span>
    </div>

    <div class="main-container">
        <div class="panel-izquierdo">
            <video id="video" autoplay playsinline muted></video>
            
            <div id="hud" class="hud-guias">
                <div id="hudTexto" class="hud-alerta">Alinee el Rostro</div>
                <div id="hudOval" class="hud-oval"></div>
                <div id="hudLineH" class="hud-linea-h"></div>
                <div id="hudLineV" class="hud-linea-v"></div>
            </div>

            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div class="panel-derecho">
            <div id="info">Preparando cámara...</div>
            
            <div class="controles">
                <button id="btnLinterna" class="btn-linterna">🔦 Linterna</button>
                <button id="btnCapturar" class="btn-primario" style="display:none;">Tomar Foto</button>
                
                <button id="btnAvanzar" class="btn-accion">Siguiente Fase ➔</button>
                <button id="btnPerfil" class="btn-primario" style="display:none; background-color: #5e5ce6;">Siguiente: Foto de Perfil ➔</button>
                <button id="btnNuevaMedicion" class="btn-primario" style="display:none; background-color: #32d74b;">Nueva Medición</button>
                <button id="btnReiniciar" class="btn-secundario">Rehacer Fase</button>
            </div>

            <div class="seccion-datos" id="seccionDatos">
                <table>
                    <tr><th>Centrado</th><th>DP</th><th>Altura</th></tr>
                    <tr><td>OD (Der)</td><td id="dpDer">-</td><td id="altDer">-</td></tr>
                    <tr><td>OI (Izq)</td><td id="dpIzq">-</td><td id="altIzq">-</td></tr>
                    <tr class="total"><td>Total</td><td id="dpTotal">-</td><td>-</td></tr>
                </table>
                <table>
                    <tr><th>Montura</th><th>A</th><th>B</th><th>Puente</th><th>Diám.</th></tr>
                    <tr><td>OD</td><td id="aDer">-</td><td id="bDer">-</td><td rowspan="2" id="puente" style="vertical-align: middle;">-</td><td id="diamDer">-</td></tr>
                    <tr><td>OI</td><td id="aIzq">-</td><td id="bIzq">-</td><td id="diamIzq">-</td></tr>
                </table>
                
                <table id="tablaPerfil" style="display:none; margin-top: 20px;">
                    <tr><th>Perfil lateral</th><th>Panto (°)</th><th>Vértice (BVD)</th></tr>
                    <tr><td>Medidas</td><td id="pantoVal" style="color: var(--accent); font-weight: bold;">-</td><td id="bvdVal" style="color: #32d74b; font-weight: bold;">-</td></tr>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const pantallaMenu = document.getElementById('pantallaMenu');
    const pantallaApp = document.getElementById('pantallaApp');
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    const faseTitulo = document.getElementById('faseTitulo');
    const seccionDatos = document.getElementById('seccionDatos');
    const tablaPerfil = document.getElementById('tablaPerfil');
    
    const hud = document.getElementById('hud');
    const hudTexto = document.getElementById('hudTexto');
    const hudOval = document.getElementById('hudOval');
    const hudLineH = document.getElementById('hudLineH');
    const hudLineV = document.getElementById('hudLineV');

    const btnCapturar = document.getElementById('btnCapturar');
    const btnLinterna = document.getElementById('btnLinterna');
    const btnAvanzar = document.getElementById('btnAvanzar');
    const btnPerfil = document.getElementById('btnPerfil');
    const btnNuevaMedicion = document.getElementById('btnNuevaMedicion');
    const btnReiniciar = document.getElementById('btnReiniciar');

    const canvasFoto = document.createElement('canvas');
    const ctxFoto = canvasFoto.getContext('2d');

    const COLOR_ZEISS = "#ffd60a"; 
    const COLOR_TARJETA = "#0a84ff"; 
    const COLOR_VERDE = "#32d74b"; 
    
    const TAMANO_TARJETA_MM = 85.6; 
    let factorEscala = 0; 
    let factorEscalaPerfil = 0; 
    
    let modoOperacion = "completa"; 
    let fase = "inicio"; 
    let marcas = {}; 
    let nodoArrastrado = null;
    let dragOffset = {x: 0, y: 0};

    let videoTrack = null;
    let linternaEncendida = false;

    // ====== EVENTOS DEL MENÚ ======
    document.getElementById('btnModoCompleto').addEventListener('click', () => {
        modoOperacion = "completa";
        iniciarApp();
    });

    document.getElementById('btnModoRapido').addEventListener('click', () => {
        modoOperacion = "rapida";
        iniciarApp();
    });

    function iniciarApp() {
        pantallaMenu.style.display = 'none';
        pantallaApp.style.display = 'block';
        encenderCamaraFrontal();
    }

    // ====== CONTROL DE CÁMARA A PRUEBA DE FALLOS ======
    async function encenderCamaraFrontal() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
            video.srcObject = stream; await video.play(); 
            
            hud.style.display = 'flex';
            
            // 1. Mostrar siempre el botón vital primero
            btnCapturar.style.display = 'block';
            info.innerHTML = "Alinee el rostro en la <b>silueta punteada</b>. Luego presione Tomar Foto.";

            // 2. Intentar cargar linterna en segundo plano (Si falla, no rompe la app)
            try {
                videoTrack = stream.getVideoTracks()[0];
                if (typeof ImageCapture !== 'undefined') {
                    const imageCapture = new ImageCapture(videoTrack);
                    imageCapture.getPhotoCapabilities().then(() => { btnLinterna.style.display = 'block'; }).catch(()=>{});
                } else {
                    const capabilities = videoTrack.getCapabilities();
                    if(capabilities && capabilities.torch) btnLinterna.style.display = 'block';
                }
            } catch (e) { console.warn("Linterna bloqueada por el navegador"); }
            
        } catch (err) { alert("Error de cámara. Revise los permisos de su navegador."); }
    }

    btnLinterna.addEventListener('click', async () => {
        if (!videoTrack) return;
        linternaEncendida = !linternaEncendida;
        try {
            await videoTrack.applyConstraints({ advanced: [{ torch: linternaEncendida }] });
            if (linternaEncendida) { btnLinterna.classList.add('activa'); btnLinterna.innerText = "🔦 Apagar"; } 
            else { btnLinterna.classList.remove('activa'); btnLinterna.innerText = "🔦 Linterna"; }
        } catch (err) { alert("No se pudo controlar el Flash en este dispositivo."); linternaEncendida = false; }
    });

    btnCapturar.addEventListener('click', async () => {
        hud.style.display = 'none';
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvasFoto.width = canvas.width; canvasFoto.height = canvas.height;
        ctxFoto.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        if (linternaEncendida && videoTrack) {
            try { await videoTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch(e){}
            linternaEncendida = false;
        }

        video.style.display = 'none'; canvas.style.display = 'block';
        btnCapturar.style.display = 'none'; btnLinterna.style.display = 'none'; 
        btnReiniciar.style.display = 'block';
        
        if(fase === "inicio") iniciarFaseCalibracion();
        else if(fase === "inicio_perfil") iniciarFaseCalibracionPerfil();
    });

    btnNuevaMedicion.addEventListener('click', () => { location.reload(); });
    
    btnReiniciar.addEventListener('click', () => { 
        if(fase.includes("perfil")) { encenderCamaraPerfil(); } 
        else { 
            canvas.style.display = 'none'; video.style.display = 'block'; 
            btnCapturar.style.display = 'block'; btnReiniciar.style.display = 'none'; btnAvanzar.style.display = 'none'; 
            hud.style.display = 'flex'; fase = "inicio"; info.innerHTML = "Reencuadre al paciente y tome la foto nuevamente."; 
            // Intentar re-mostrar linterna
            if(videoTrack) {
                try {
                    if (typeof ImageCapture !== 'undefined') { btnLinterna.style.display = 'block'; }
                    else if (videoTrack.getCapabilities().torch) { btnLinterna.style.display = 'block'; }
                } catch(e){}
            }
        }
    });

    // ====== FASES FRENTE ======
    function iniciarFaseCalibracion() {
        fase = "calibracion"; faseTitulo.innerText = "Fase 1: Calibración Frontal";
        info.innerHTML = "Arrastra los <b>puntos azules</b> a los extremos de la tarjeta.";
        let w = canvas.width, h = canvas.height;
        marcas = { tarjetaIzq: { x: w*0.35, y: h*0.25 }, tarjetaDer: { x: w*0.65, y: h*0.25 } };
        btnAvanzar.style.display = "block"; btnAvanzar.innerText = "Siguiente: Montura ➔";
        dibujarTodo();
    }

    function iniciarFaseMontura() {
        fase = "montura"; faseTitulo.innerText = "Fase 2: Sistema Boxing";
        info.innerHTML = "Arrastra las esquinas amarillas para <b>enmarcar los aros</b>.";
        factorEscala = TAMANO_TARJETA_MM / Math.hypot(marcas.tarjetaDer.x - marcas.tarjetaIzq.x, marcas.tarjetaDer.y - marcas.tarjetaIzq.y);
        let w = canvas.width, h = canvas.height;
        marcas = { odTL: {x: w*0.3, y: h*0.35}, odBR: {x: w*0.45, y: h*0.5}, oiTL: {x: w*0.55, y: h*0.35}, oiBR: {x: w*0.7, y: h*0.5} };
        btnAvanzar.innerText = "Siguiente: Pupilas ➔"; dibujarTodo();
    }

    function iniciarFasePupilas() {
        fase = "pupilas"; faseTitulo.innerText = "Fase 3: Centrado";
        info.innerHTML = "Arrastra los botones inferiores (✥) al <b>reflejo corneal</b>.";
        marcas.pupDer = { x: (marcas.odTL.x + marcas.odBR.x)/2, y: (marcas.odTL.y + marcas.odBR.y)/2 };
        marcas.pupIzq = { x: (marcas.oiTL.x + marcas.oiBR.x)/2, y: (marcas.oiTL.y + marcas.oiBR.y)/2 };
        btnAvanzar.innerText = "Calcular Frente ✓"; dibujarTodo();
    }

    function calcularResultadosFrente() {
        fase = "resultados_frente"; faseTitulo.innerText = "Resultados: Frente"; 
        btnAvanzar.style.display = "none"; 
        
        if(modoOperacion === "completa") {
            info.innerHTML = "✅ Biometría Frontal lista. Continuemos con el perfil.";
            btnPerfil.style.display = "block"; 
        } else {
            info.innerHTML = "✅ Biometría Rápida finalizada.";
            btnNuevaMedicion.style.display = "block"; 
        }
        
        dibujarTodo(); 

        let aDer = Math.abs(marcas.odBR.x - marcas.odTL.x) * factorEscala, bDer = Math.abs(marcas.odBR.y - marcas.odTL.y) * factorEscala;
        let aIzq = Math.abs(marcas.oiBR.x - marcas.oiTL.x) * factorEscala, bIzq = Math.abs(marcas.oiBR.y - marcas.oiTL.y) * factorEscala;

        let bordeNasalDer = Math.max(marcas.odTL.x, marcas.odBR.x), bordeNasalIzq = Math.min(marcas.oiTL.x, marcas.oiBR.x);
        let puenteMM = Math.abs(bordeNasalIzq - bordeNasalDer) * factorEscala;
        let centroPuenteX = bordeNasalDer + ((bordeNasalIzq - bordeNasalDer) / 2);

        let dpDer = Math.abs(marcas.pupDer.x - centroPuenteX) * factorEscala, dpIzq = Math.abs(marcas.pupIzq.x - centroPuenteX) * factorEscala;
        let altDer = Math.abs(Math.max(marcas.odTL.y, marcas.odBR.y) - marcas.pupDer.y) * factorEscala;
        let altIzq = Math.abs(Math.max(marcas.oiTL.y, marcas.oiBR.y) - marcas.pupIzq.y) * factorEscala;

        document.getElementById('dpDer').innerText = dpDer.toFixed(1); document.getElementById('dpIzq').innerText = dpIzq.toFixed(1); document.getElementById('dpTotal').innerText = (dpDer + dpIzq).toFixed(1);
        document.getElementById('altDer').innerText = altDer.toFixed(1); document.getElementById('altIzq').innerText = altIzq.toFixed(1);
        document.getElementById('aDer').innerText = aDer.toFixed(1); document.getElementById('bDer').innerText = bDer.toFixed(1);
        document.getElementById('aIzq').innerText = aIzq.toFixed(1); document.getElementById('bIzq').innerText = bIzq.toFixed(1);
        document.getElementById('puente').innerText = puenteMM.toFixed(1);
        document.getElementById('diamDer').innerText = Math.ceil(aDer + (2 * Math.abs(((aDer + puenteMM)/2) - dpDer)) + 2); 
        document.getElementById('diamIzq').innerText = Math.ceil(aIzq + (2 * Math.abs(((aIzq + puenteMM)/2) - dpIzq)) + 2);
        
        seccionDatos.style.display = 'block';
    }

    // ====== FASES PERFIL ======
    btnPerfil.addEventListener('click', () => { encenderCamaraPerfil(); });

    async function encenderCamaraPerfil() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
            video.srcObject = stream; await video.play(); 
            
            fase = "inicio_perfil"; faseTitulo.innerText = "Fase 4: Foto de Perfil";
            
            canvas.style.display = 'none'; video.style.display = 'block';
            seccionDatos.style.display = 'none'; btnPerfil.style.display = 'none';
            btnCapturar.style.display = 'block'; btnReiniciar.style.display = 'none';
            
            hud.style.display = 'flex';
            hudTexto.innerText = "Rostro de Perfil (90°)";
            hudOval.style.border = "none"; 
            hudLineH.style.display = "none"; 
            hudLineV.style.borderLeft = "2px dashed var(--accent)"; 
            
            info.innerHTML = "Pida al paciente girar <b>90 grados</b>. Coloque la tarjeta a un lado de la cara y presione Tomar Foto.";

            // Linterna segura
            try {
                videoTrack = stream.getVideoTracks()[0];
                if (typeof ImageCapture !== 'undefined') {
                    const imageCapture = new ImageCapture(videoTrack);
                    imageCapture.getPhotoCapabilities().then(() => { btnLinterna.style.display = 'block'; }).catch(()=>{});
                } else {
                    const capabilities = videoTrack.getCapabilities();
                    if(capabilities && capabilities.torch) btnLinterna.style.display = 'block';
                }
            } catch (e) { console.warn("Linterna bloqueada"); }

        } catch (err) { alert("Error de cámara"); }
    }

    function iniciarFaseCalibracionPerfil() {
        fase = "calibracion_perfil"; faseTitulo.innerText = "Fase 5: Calibración Perfil";
        info.innerHTML = "Arrastra los <b>puntos azules</b> a los extremos de la tarjeta lateral.";
        let w = canvas.width, h = canvas.height;
        marcas = { tarjPerfIzq: { x: w*0.4, y: h*0.7 }, tarjPerfDer: { x: w*0.6, y: h*0.7 } };
        btnAvanzar.style.display = "block"; btnAvanzar.innerText = "Siguiente: Panto y BVD ➔";
        dibujarTodo();
    }

    function iniciarFaseMedicionPerfil() {
        fase = "medicion_perfil"; faseTitulo.innerText = "Fase 6: Ángulo y Vértice";
        info.innerHTML = "<b>Amarillos:</b> Borde Superior e Inferior del Aro.<br><b>Verdes:</b> Ápice de Córnea y Cara interna del Lente.";
        factorEscalaPerfil = TAMANO_TARJETA_MM / Math.hypot(marcas.tarjPerfDer.x - marcas.tarjPerfIzq.x, marcas.tarjPerfDer.y - marcas.tarjPerfIzq.y);
        
        let w = canvas.width, h = canvas.height;
        marcas = {
            pantoTop: {x: w*0.5, y: h*0.35, color: COLOR_ZEISS},
            pantoBot: {x: w*0.45, y: h*0.55, color: COLOR_ZEISS},
            bvdCornea: {x: w*0.4, y: h*0.45, color: COLOR_VERDE},
            bvdLente: {x: w*0.48, y: h*0.45, color: COLOR_VERDE}
        };
        btnAvanzar.innerText = "Calcular Resultados Finales ✓"; dibujarTodo();
    }

    function calcularResultadosPerfil() {
        fase = "resultados_finales"; faseTitulo.innerText = "Resultados Finales"; 
        info.innerHTML = "🎉 <b>¡Biometría completa!</b> (Frontal y Perfil).";
        btnAvanzar.style.display = "none"; btnNuevaMedicion.style.display = "block"; dibujarTodo(); 

        let dxPanto = Math.abs(marcas.pantoBot.x - marcas.pantoTop.x);
        let dyPanto = Math.abs(marcas.pantoBot.y - marcas.pantoTop.y);
        let pantoAngulo = Math.atan(dxPanto / dyPanto) * (180 / Math.PI); 

        let bvdDist = Math.hypot(marcas.bvdCornea.x - marcas.bvdLente.x, marcas.bvdCornea.y - marcas.bvdLente.y) * factorEscalaPerfil;

        document.getElementById('pantoVal').innerText = pantoAngulo.toFixed(1) + "°";
        document.getElementById('bvdVal').innerText = bvdDist.toFixed(1) + " mm";

        tablaPerfil.style.display = "table";
        seccionDatos.style.display = "block";
        
        setTimeout(() => { document.querySelector('.panel-derecho').scrollTo({ top: document.querySelector('.panel-derecho').scrollHeight, behavior: 'smooth' }); }, 100);
    }

    // ====== NAVEGACIÓN ======
    btnAvanzar.addEventListener('click', () => {
        if(fase === "calibracion") iniciarFaseMontura(); 
        else if(fase === "montura") iniciarFasePupilas(); 
        else if(fase === "pupilas") calcularResultadosFrente();
        else if(fase === "calibracion_perfil") iniciarFaseMedicionPerfil();
        else if(fase === "medicion_perfil") calcularResultadosPerfil();
    });

    // ====== DIBUJO ======
    function dibujarTodo() {
        if(!canvasFoto.width) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(canvasFoto, 0, 0);

        if(fase === "calibracion") {
            ctx.beginPath(); ctx.moveTo(marcas.tarjetaIzq.x, marcas.tarjetaIzq.y); ctx.lineTo(marcas.tarjetaDer.x, marcas.tarjetaDer.y); ctx.strokeStyle = COLOR_TARJETA; ctx.lineWidth = 3; ctx.stroke();
            dibujarPunto(marcas.tarjetaIzq.x, marcas.tarjetaIzq.y, COLOR_TARJETA); dibujarPunto(marcas.tarjetaDer.x, marcas.tarjetaDer.y, COLOR_TARJETA);
        }
        if(fase === "montura" || fase === "pupilas" || fase === "resultados_frente" || (fase === "resultados_finales" && modoOperacion === "rapida")) {
            dibujarCaja(marcas.odTL, marcas.odBR, fase === "montura"); dibujarCaja(marcas.oiTL, marcas.oiBR, fase === "montura");
        }
        if(fase === "pupilas" || fase === "resultados_frente" || (fase === "resultados_finales" && modoOperacion === "rapida")) {
            dibujarMiraConJoystick(marcas.pupDer.x, marcas.pupDer.y, fase === "pupilas", COLOR_ZEISS); dibujarMiraConJoystick(marcas.pupIzq.x, marcas.pupIzq.y, fase === "pupilas", COLOR_ZEISS);
        }

        if(fase === "calibracion_perfil") {
            ctx.beginPath(); ctx.moveTo(marcas.tarjPerfIzq.x, marcas.tarjPerfIzq.y); ctx.lineTo(marcas.tarjPerfDer.x, marcas.tarjPerfDer.y); ctx.strokeStyle = COLOR_TARJETA; ctx.lineWidth = 3; ctx.stroke();
            dibujarPunto(marcas.tarjPerfIzq.x, marcas.tarjPerfIzq.y, COLOR_TARJETA); dibujarPunto(marcas.tarjPerfDer.x, marcas.tarjPerfDer.y, COLOR_TARJETA);
        }
        if(fase === "medicion_perfil" || (fase === "resultados_finales" && modoOperacion === "completa")) {
            ctx.beginPath(); ctx.moveTo(marcas.pantoTop.x, marcas.pantoTop.y); ctx.lineTo(marcas.pantoBot.x, marcas.pantoBot.y); ctx.strokeStyle = COLOR_ZEISS; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(marcas.bvdCornea.x, marcas.bvdCornea.y); ctx.lineTo(marcas.bvdLente.x, marcas.bvdLente.y); ctx.strokeStyle = COLOR_VERDE; ctx.lineWidth = 3; ctx.stroke();
            
            dibujarMiraConJoystick(marcas.pantoTop.x, marcas.pantoTop.y, fase === "medicion_perfil", COLOR_ZEISS);
            dibujarMiraConJoystick(marcas.pantoBot.x, marcas.pantoBot.y, fase === "medicion_perfil", COLOR_ZEISS);
            dibujarMiraConJoystick(marcas.bvdCornea.x, marcas.bvdCornea.y, fase === "medicion_perfil", COLOR_VERDE);
            dibujarMiraConJoystick(marcas.bvdLente.x, marcas.bvdLente.y, fase === "medicion_perfil", COLOR_VERDE);
        }
    }

    function dibujarPunto(x, y, color) {
        ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.fill(); 
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.stroke();
    }

    function dibujarCaja(pTL, pBR, interactiva) {
        let x = Math.min(pTL.x, pBR.x), y = Math.min(pTL.y, pBR.y), w = Math.abs(pBR.x - pTL.x), h = Math.abs(pBR.y - pTL.y);
        ctx.strokeStyle = COLOR_ZEISS; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
        if(interactiva) { dibujarPunto(pTL.x, pTL.y, COLOR_ZEISS); dibujarPunto(pBR.x, pBR.y, COLOR_ZEISS); }
    }

    function dibujarMiraConJoystick(x, y, interactivo, color) {
        ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-22, y); ctx.lineTo(x+22, y); ctx.moveTo(x, y-22); ctx.lineTo(x, y+22); ctx.stroke();
        if (interactivo) {
            const offsetY = canvas.width * 0.08; 
            ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(x, y+22); ctx.lineTo(x, y+offsetY-20); ctx.stroke(); ctx.setLineDash([]);
            let joyY = y + offsetY;
            ctx.fillStyle = "rgba(28, 28, 30, 0.85)"; ctx.beginPath(); ctx.arc(x, joyY, 24, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, joyY, 24, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = color; ctx.font = "20px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("✥", x, joyY);
        }
    }

    // ====== EVENTOS TÁCTILES ======
    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault(); canvas.setPointerCapture(e.pointerId);
        const rect = canvas.getBoundingClientRect(); const ratio = canvas.width / rect.width;
        let x = (e.clientX - rect.left) * ratio, y = (e.clientY - rect.top) * ratio, radio = 50 * ratio;

        if (fase === "calibracion") {
            for(let key of ['tarjetaIzq', 'tarjetaDer']) { if(Math.hypot(marcas[key].x - x, marcas[key].y - y) < radio) { nodoArrastrado = key; dragOffset = {x: x - marcas[key].x, y: y - marcas[key].y}; break; } }
        } else if (fase === "montura") {
            for(let key of ['odTL', 'odBR', 'oiTL', 'oiBR']) { if(Math.hypot(marcas[key].x - x, marcas[key].y - y) < radio) { nodoArrastrado = key; dragOffset = {x: x - marcas[key].x, y: y - marcas[key].y}; break; } }
        } else if (fase === "pupilas") {
            let offsetY = canvas.width * 0.08;
            for(let key of ['pupDer', 'pupIzq']) { if(Math.hypot(marcas[key].x - x, (marcas[key].y + offsetY) - y) < radio || Math.hypot(marcas[key].x - x, marcas[key].y - y) < radio) { nodoArrastrado = key; dragOffset = {x: x - marcas[key].x, y: y - marcas[key].y}; break; } }
        } else if (fase === "calibracion_perfil") {
            for(let key of ['tarjPerfIzq', 'tarjPerfDer']) { if(Math.hypot(marcas[key].x - x, marcas[key].y - y) < radio) { nodoArrastrado = key; dragOffset = {x: x - marcas[key].x, y: y - marcas[key].y}; break; } }
        } else if (fase === "medicion_perfil") {
            let offsetY = canvas.width * 0.08;
            for(let key of ['pantoTop', 'pantoBot', 'bvdCornea', 'bvdLente']) {
                if(Math.hypot(marcas[key].x - x, (marcas[key].y + offsetY) - y) < radio || Math.hypot(marcas[key].x - x, marcas[key].y - y) < radio) {
                    nodoArrastrado = key; dragOffset = {x: x - marcas[key].x, y: y - marcas[key].y}; break;
                }
            }
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        if(!nodoArrastrado) return; e.preventDefault();
        const rect = canvas.getBoundingClientRect(); const ratio = canvas.width / rect.width;
        marcas[nodoArrastrado].x = ((e.clientX - rect.left) * ratio) - dragOffset.x; marcas[nodoArrastrado].y = ((e.clientY - rect.top) * ratio) - dragOffset.y;
        dibujarTodo();
    });

    canvas.addEventListener('pointerup', (e) => { nodoArrastrado = null; canvas.releasePointerCapture(e.pointerId); });
    canvas.addEventListener('pointercancel', (e) => { nodoArrastrado = null; canvas.releasePointerCapture(e.pointerId); });

</script>
