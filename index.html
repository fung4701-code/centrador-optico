<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centrador Pro - Joysticks de Precisión</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #121212; color: #ffffff; margin: 0; padding: 0; user-select: none; }
        .header { background-color: #1f1f1f; padding: 10px; font-size: 18px; font-weight: bold; border-bottom: 2px solid #007bff; }
        .container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        video, canvas { width: 100%; max-height: 60vh; object-fit: cover; background-color: #000; touch-action: none; cursor: crosshair; }
        
        .controles { margin-top: 10px; width: 100%; display: flex; justify-content: center; flex-wrap: wrap; }
        button { padding: 12px 20px; font-size: 16px; margin: 5px; font-weight: bold; border-radius: 8px; border: none; }
        .btn-primario { background-color: #007bff; color: white; width: 90%; }
        .btn-secundario { background-color: #444; color: white; width: 40%; display: none; }
        #info { margin-top: 10px; font-size: 14px; padding: 10px; background: #2a2a2a; border-radius: 8px; width: 90%; border-left: 5px solid #ff9800; }
        
        table { width: 90%; margin-top: 10px; border-collapse: collapse; display: none; background: #1f1f1f; border-radius: 8px; overflow: hidden; }
        th, td { padding: 8px; border-bottom: 1px solid #333; text-align: center; font-size: 15px; }
        th { background-color: #007bff; color: white; }
        .destacado { color: #00ff00; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="header">Geometría Facial (Precisión)</div>

<div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controles">
        <button id="btnIniciar" class="btn-primario">📸 Iniciar Cámara</button>
        <button id="btnCapturar" class="btn-primario" style="display:none;">Congelar Imagen</button>
        <button id="btnReiniciar" class="btn-secundario">Repetir Foto</button>
    </div>

    <div id="info">1️⃣ Pon la tarjeta en la frente del paciente. Toca "Iniciar Cámara".</div>

    <table id="tablaResultados">
        <tr><th>Medida</th><th>OD (Der)</th><th>OI (Izq)</th></tr>
        <tr><td>D.P. Monocular</td><td id="dpDer">-</td><td id="dpIzq">-</td></tr>
        <tr><td>Altura Pupilar</td><td id="altDer">-</td><td id="altIzq">-</td></tr>
        <tr><td><b>D.P. Total</b></td><td colspan="2" id="dpTotal" class="destacado">-</td></tr>
    </table>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btnIniciar = document.getElementById('btnIniciar');
    const btnCapturar = document.getElementById('btnCapturar');
    const btnReiniciar = document.getElementById('btnReiniciar');
    const info = document.getElementById('info');
    const tablaResultados = document.getElementById('tablaResultados');

    const canvasFoto = document.createElement('canvas');
    const ctxFoto = canvasFoto.getContext('2d');

    const TAMANO_TARJETA_MM = 85.6; 
    let factorEscala = 0; 

    let marcas = {}; 
    let ordenPasos = ['tarjetaIzq', 'tarjetaDer', 'nariz', 'pupilaDer', 'pupilaIzq', 'baseDer', 'baseIzq'];
    let descripciones = [
        "Toca el borde IZQUIERDO de la tarjeta.",
        "Toca el borde DERECHO de la tarjeta.",
        "Toca el centro del PUENTE de la nariz.",
        "Toca la PUPILA DERECHA del paciente (a tu izq).",
        "Toca la PUPILA IZQUIERDA del paciente.",
        "Toca el ARO INFERIOR bajo la pupila derecha.",
        "Toca el ARO INFERIOR bajo la pupila izquierda."
    ];
    let pasoActual = 0;
    
    let nodoArrastrado = null; 
    let editando = false; 
    
    // Variables para un arrastre perfecto (sin saltos)
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // INICIAR CÁMARA
    btnIniciar.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
            });
            video.srcObject = stream;
            btnIniciar.style.display = 'none';
            btnCapturar.style.display = 'block';
            info.innerHTML = "Alinea al paciente. Presiona <b>Congelar Imagen</b>.";
        } catch (err) { alert("Error de cámara."); }
    });

    // CAPTURAR FOTO
    btnCapturar.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        canvasFoto.width = canvas.width;
        canvasFoto.height = canvas.height;
        ctxFoto.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        video.style.display = 'none';
        canvas.style.display = 'block';
        btnCapturar.style.display = 'none';
        btnReiniciar.style.display = 'block';
        
        marcas = {};
        pasoActual = 0;
        editando = false;
        tablaResultados.style.display = 'none';
        info.innerHTML = `📐 <b>Paso 1:</b> ${descripciones[pasoActual]}`;
        
        dibujarTodo(); 
    });

    btnReiniciar.addEventListener('click', () => {
        video.style.display = 'block'; canvas.style.display = 'none';
        btnCapturar.style.display = 'block'; btnReiniciar.style.display = 'none';
        tablaResultados.style.display = 'none'; info.innerHTML = "Alinea al paciente y toma la foto.";
    });

    // =============== MOTOR DE RENDERIZADO ===============

    function dibujarTodo() {
        if(!canvasFoto.width) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(canvasFoto, 0, 0);

        // Líneas geométricas principales
        if (marcas.tarjetaIzq && marcas.tarjetaDer) dibujarLinea(marcas.tarjetaIzq, marcas.tarjetaDer, "#00aaff");
        if (marcas.nariz) dibujarLinea({x: marcas.nariz.x, y: 0}, {x: marcas.nariz.x, y: canvas.height}, "#ff9800", true);
        if (marcas.nariz && marcas.pupilaDer) dibujarLinea(marcas.pupilaDer, {x: marcas.nariz.x, y: marcas.pupilaDer.y}, "#00ff00");
        if (marcas.nariz && marcas.pupilaIzq) dibujarLinea(marcas.pupilaIzq, {x: marcas.nariz.x, y: marcas.pupilaIzq.y}, "#00ff00");
        if (marcas.pupilaDer && marcas.baseDer) dibujarLinea(marcas.pupilaDer, {x: marcas.pupilaDer.x, y: marcas.baseDer.y}, "#ff00ff", true);
        if (marcas.pupilaIzq && marcas.baseIzq) dibujarLinea(marcas.pupilaIzq, {x: marcas.pupilaIzq.x, y: marcas.baseIzq.y}, "#ff00ff", true);

        // Dibujar las Miras con sus Joysticks
        for (let key in marcas) dibujarMira(marcas[key].x, marcas[key].y, marcas[key].color);
    }

    function dibujarMira(x, y, color) {
        // 1. DIBUJAR LA CRUZ PRINCIPAL (Crosshair transparente en el centro)
        ctx.strokeStyle = color; 
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x - 20, y); ctx.lineTo(x + 20, y); // Horizontal
        ctx.moveTo(x, y - 20); ctx.lineTo(x, y + 20); // Vertical
        ctx.stroke();

        // 2. DIBUJAR EL "JOYSTICK" (Solo si estamos en Modo Edición)
        if (editando) {
            // Distancia del joystick hacia abajo, escalada al tamaño de la cámara
            const offsetJoystickY = canvas.width * 0.08; 
            
            // Línea punteada que conecta la cruz con el joystick
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(x, y + 25);
            ctx.lineTo(x, y + offsetJoystickY - 25);
            ctx.stroke();
            ctx.setLineDash([]);

            // El botón del Joystick
            let joyY = y + offsetJoystickY;
            
            // Fondo oscuro semitransparente del joystick
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)"; 
            ctx.beginPath();
            ctx.arc(x, joyY, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Borde coloreado
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, joyY, 25, 0, Math.PI * 2);
            ctx.stroke();

            // Ícono de flechas adentro
            ctx.fillStyle = "#ffffff";
            ctx.font = "24px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("✥", x, joyY);
        }
    }

    function dibujarLinea(p1, p2, color, punteada = false) {
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        if(punteada) ctx.setLineDash([5, 5]); else ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.setLineDash([]);
    }

    // =============== MATEMÁTICAS ===============

    function calcularMedidas() {
        if (!marcas.tarjetaIzq || !marcas.tarjetaDer || !marcas.nariz || !marcas.pupilaDer || !marcas.pupilaIzq || !marcas.baseDer || !marcas.baseIzq) return;

        const dxT = marcas.tarjetaDer.x - marcas.tarjetaIzq.x;
        const dyT = marcas.tarjetaDer.y - marcas.tarjetaIzq.y;
        factorEscala = TAMANO_TARJETA_MM / Math.sqrt(dxT * dxT + dyT * dyT);

        const dpDerMM = Math.abs(marcas.pupilaDer.x - marcas.nariz.x) * factorEscala;
        const dpIzqMM = Math.abs(marcas.pupilaIzq.x - marcas.nariz.x) * factorEscala;
        const altDerMM = Math.abs(marcas.baseDer.y - marcas.pupilaDer.y) * factorEscala;
        const altIzqMM = Math.abs(marcas.baseIzq.y - marcas.pupilaIzq.y) * factorEscala;

        document.getElementById('dpDer').innerText = dpDerMM.toFixed(1) + " mm";
        document.getElementById('dpIzq').innerText = dpIzqMM.toFixed(1) + " mm";
        document.getElementById('altDer').innerText = altDerMM.toFixed(1) + " mm";
        document.getElementById('altIzq').innerText = altIzqMM.toFixed(1) + " mm";
        document.getElementById('dpTotal').innerText = (dpDerMM + dpIzqMM).toFixed(1) + " mm";

        tablaResultados.style.display = 'table';
        info.innerHTML = "✅ <b>Modo Edición:</b> Usa los círculos inferiores (✥) para mover las cruces sin taparlas con tu dedo.";
    }

    // =============== CONTROLES TÁCTILES ANTI-OBSTRUCCIÓN ===============

    function obtenerCoordenadas(evento) {
        const rect = canvas.getBoundingClientRect();
        const ratioX = canvas.width / rect.width; 
        return {
            x: (evento.clientX - rect.left) * ratioX,
            y: (evento.clientY - rect.top) * (canvas.height / rect.height),
            ratio: ratioX 
        };
    }

    canvas.addEventListener('pointerdown', (evento) => {
        evento.preventDefault();
        canvas.setPointerCapture(evento.pointerId); 
        
        const pos = obtenerCoordenadas(evento);
        const radioAgarreSeguro = 60 * pos.ratio; // Radio amplio para que sea fácil tocarlo

        if (editando) {
            const offsetJoystickY = canvas.width * 0.08; // Misma distancia del dibujo

            for (let key in marcas) {
                // Coordenadas del Joystick inferior
                let joyX = marcas[key].x;
                let joyY = marcas[key].y + offsetJoystickY;
                
                // Opción 1: ¿El usuario tocó el Joystick de abajo?
                let dxJoy = joyX - pos.x;
                let dyJoy = joyY - pos.y;
                if (Math.sqrt(dxJoy * dxJoy + dyJoy * dyJoy) < radioAgarreSeguro) {
                    nodoArrastrado = key;
                    // Guardamos la diferencia exacta para que la cruz no salte
                    dragOffsetX = pos.x - marcas[key].x;
                    dragOffsetY = pos.y - marcas[key].y;
                    return; 
                }

                // Opción 2: ¿El usuario tocó la cruz directamente por costumbre?
                let dxCruz = marcas[key].x - pos.x;
                let dyCruz = marcas[key].y - pos.y;
                if (Math.sqrt(dxCruz * dxCruz + dyCruz * dyCruz) < radioAgarreSeguro) {
                    nodoArrastrado = key;
                    dragOffsetX = pos.x - marcas[key].x;
                    dragOffsetY = pos.y - marcas[key].y;
                    return;
                }
            }
        } else {
            // Fase de colocar puntos iniciales
            if (pasoActual < ordenPasos.length) {
                let idPaso = ordenPasos[pasoActual];
                let color = "#00ff00"; 
                if(idPaso.includes("tarjeta")) color = "#00aaff"; 
                if(idPaso.includes("nariz")) color = "#ff9800"; 
                if(idPaso.includes("base")) color = "#ff00ff"; 

                marcas[idPaso] = { x: pos.x, y: pos.y, color: color };
                pasoActual++;

                if (pasoActual < ordenPasos.length) {
                    info.innerHTML = `📍 <b>Paso ${pasoActual + 1}:</b> ${descripciones[pasoActual]}`;
                } else {
                    editando = true; // Activar joysticks
                }
                dibujarTodo();
                if (editando) calcularMedidas();
            }
        }
    });

    canvas.addEventListener('pointermove', (evento) => {
        if (!nodoArrastrado) return; 
        evento.preventDefault();
        
        const pos = obtenerCoordenadas(evento);
        // El punto principal se mueve manteniendo la distancia al dedo
        marcas[nodoArrastrado].x = pos.x - dragOffsetX;
        marcas[nodoArrastrado].y = pos.y - dragOffsetY;
        
        dibujarTodo(); 
        if (editando) calcularMedidas(); 
    });

    canvas.addEventListener('pointerup', (evento) => {
        nodoArrastrado = null;
        canvas.releasePointerCapture(evento.pointerId);
    });

    canvas.addEventListener('pointercancel', (evento) => {
        nodoArrastrado = null;
        canvas.releasePointerCapture(evento.pointerId);
    });

</script>

</body>
</html>
