<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centrador Optométrico Pro</title>
    <style>
        /* Paleta de colores estilo Zeiss i.Terminal */
        :root {
            --bg-color: #2b2b2d;
            --panel-bg: #1c1c1e;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent: #ffd60a; /* Amarillo Zeiss */
            --border-color: #38383a;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); 
            user-select: none; overflow: hidden;
        }

        /* Cabecera minimalista */
        .header { 
            padding: 15px 20px; font-size: 20px; font-weight: 300; letter-spacing: 0.5px; 
            border-bottom: 1px solid var(--border-color); background: var(--bg-color);
        }

        /* Contenedor Flexbox: Columna en vertical, Fila en horizontal */
        .main-container { 
            display: flex; flex-direction: column; height: calc(100vh - 55px); width: 100vw;
        }

        /* Panel Izquierdo: Cámara / Foto */
        .panel-izquierdo { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            background: #000; position: relative; overflow: hidden;
        }
        video, canvas { 
            max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; cursor: crosshair;
        }

        /* Panel Derecho: Controles y Tablas */
        .panel-derecho { 
            flex: 1; padding: 20px; background: var(--panel-bg); overflow-y: auto; 
            display: flex; flex-direction: column; gap: 20px; border-top: 1px solid var(--border-color);
        }

        /* Caja de instrucciones */
        #info { 
            background: #2c2c2e; padding: 15px; border-radius: 8px; font-size: 15px; 
            border-left: 4px solid var(--accent); line-height: 1.4; font-weight: 300;
        }

        /* Botones */
        .controles { display: flex; gap: 10px; width: 100%; }
        button { 
            flex: 1; padding: 14px 10px; font-size: 16px; font-weight: 500; 
            border-radius: 8px; border: none; cursor: pointer; transition: 0.2s;
        }
        .btn-primario { background-color: #007aff; color: white; }
        .btn-primario:active { background-color: #005bb5; }
        .btn-secundario { background-color: #3a3a3c; color: white; display: none; }

        /* Estilo de Tabla estilo Zeiss */
        .seccion-datos { display: none; }
        h3 { margin: 0 0 10px 0; font-weight: 400; font-size: 18px; color: var(--text-main); }
        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 400; font-size: 13px; text-align: right; }
        td:first-child { text-align: left; color: var(--text-muted); font-weight: 500; width: 30%; }
        td { text-align: right; }
        tr:last-child td { border-bottom: none; }
        .fila-total { border-top: 1px solid var(--text-muted); }

        /* MAGIA RESPONSIVE: Si giras el teléfono a horizontal (Landscape) */
        @media (min-width: 600px) and (orientation: landscape) {
            .main-container { flex-direction: row; }
            .panel-izquierdo { flex: 1.5; border-right: 1px solid var(--border-color); }
            .panel-derecho { flex: 1; border-top: none; }
        }
    </style>
</head>
<body>

<div class="header">i.Terminal Prototipo</div>

<div class="main-container">
    <!-- PANEL IZQUIERDO -->
    <div class="panel-izquierdo">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- PANEL DERECHO -->
    <div class="panel-derecho">
        <div class="controles">
            <button id="btnIniciar" class="btn-primario">Iniciar Cámara</button>
            <button id="btnCapturar" class="btn-primario" style="display:none;">Congelar Imagen</button>
            <button id="btnReiniciar" class="btn-secundario">Rehacer</button>
        </div>

        <div id="info">Coloca la tarjeta de calibración frontal. Toca "Iniciar Cámara".</div>

        <!-- Tabla de Datos (Estilo Zeiss) -->
        <div class="seccion-datos" id="seccionDatos">
            <h3>Datos de centrado</h3>
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>DP</th>
                        <th>Altura seg.</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>D</td> <!-- Derecho -->
                        <td id="dpDer">-</td>
                        <td id="altDer">-</td>
                    </tr>
                    <tr>
                        <td>I</td> <!-- Izquierdo -->
                        <td id="dpIzq">-</td>
                        <td id="altIzq">-</td>
                    </tr>
                    <tr class="fila-total">
                        <td>Total</td>
                        <td id="dpTotal">-</td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btnIniciar = document.getElementById('btnIniciar');
    const btnCapturar = document.getElementById('btnCapturar');
    const btnReiniciar = document.getElementById('btnReiniciar');
    const info = document.getElementById('info');
    const seccionDatos = document.getElementById('seccionDatos');

    const canvasFoto = document.createElement('canvas');
    const ctxFoto = canvasFoto.getContext('2d');

    const TAMANO_TARJETA_MM = 85.6; 
    let factorEscala = 0; 

    // CONFIGURACIÓN VISUAL
    const COLOR_ZEISS = "#ffd60a"; // Amarillo

    let marcas = {}; 
    let ordenPasos = ['tarjetaIzq', 'tarjetaDer', 'nariz', 'pupilaDer', 'pupilaIzq', 'baseDer', 'baseIzq'];
    let descripciones = [
        "Calibración: Borde IZQ de la tarjeta.",
        "Calibración: Borde DER de la tarjeta.",
        "Toque el centro del puente nasal.",
        "Toque la pupila DERECHA (D).",
        "Toque la pupila IZQUIERDA (I).",
        "Toque la altura del aro DERECHO.",
        "Toque la altura del aro IZQUIERDO."
    ];
    let pasoActual = 0;
    
    let nodoArrastrado = null; 
    let editando = false; 
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    btnIniciar.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            await video.play(); 
            btnIniciar.style.display = 'none';
            btnCapturar.style.display = 'block';
            info.innerHTML = "Alinee al paciente. Asegure visibilidad del armazón.<br><br>Presione <b>Congelar Imagen</b>.";
        } catch (err) { 
            alert("No se pudo abrir la cámara. Motivo: " + err.message); 
            info.innerHTML = "❌ Error de cámara.";
        }
    });

    btnCapturar.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        canvasFoto.width = canvas.width;
        canvasFoto.height = canvas.height;
        ctxFoto.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        video.style.display = 'none';
        canvas.style.display = 'block';
        btnCapturar.style.display = 'none';
        btnReiniciar.style.display = 'block';
        
        marcas = {}; pasoActual = 0; editando = false;
        seccionDatos.style.display = 'none';
        info.innerHTML = `Paso ${pasoActual + 1}: <b>${descripciones[pasoActual]}</b>`;
        dibujarTodo(); 
    });

    btnReiniciar.addEventListener('click', () => {
        video.style.display = 'block'; canvas.style.display = 'none';
        btnCapturar.style.display = 'block'; btnReiniciar.style.display = 'none';
        seccionDatos.style.display = 'none'; info.innerHTML = "Alinee al paciente y tome la foto.";
    });

    // =============== MOTOR DE RENDERIZADO (ESTILO ZEISS) ===============

    function dibujarTodo() {
        if(!canvasFoto.width) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(canvasFoto, 0, 0);

        // Líneas geométricas delgadas amarillas
        if (marcas.tarjetaIzq && marcas.tarjetaDer) dibujarLinea(marcas.tarjetaIzq, marcas.tarjetaDer, COLOR_ZEISS);
        if (marcas.nariz) dibujarLinea({x: marcas.nariz.x, y: 0}, {x: marcas.nariz.x, y: canvas.height}, COLOR_ZEISS, true);
        if (marcas.nariz && marcas.pupilaDer) dibujarLinea(marcas.pupilaDer, {x: marcas.nariz.x, y: marcas.pupilaDer.y}, COLOR_ZEISS);
        if (marcas.nariz && marcas.pupilaIzq) dibujarLinea(marcas.pupilaIzq, {x: marcas.nariz.x, y: marcas.pupilaIzq.y}, COLOR_ZEISS);
        if (marcas.pupilaDer && marcas.baseDer) dibujarLinea(marcas.pupilaDer, {x: marcas.pupilaDer.x, y: marcas.baseDer.y}, COLOR_ZEISS, true);
        if (marcas.pupilaIzq && marcas.baseIzq) dibujarLinea(marcas.pupilaIzq, {x: marcas.pupilaIzq.x, y: marcas.baseIzq.y}, COLOR_ZEISS, true);

        for (let key in marcas) dibujarMira(marcas[key].x, marcas[key].y);
    }

    function dibujarLinea(p1, p2, color, punteada = false) {
        ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 3; // Sombra negra
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        
        ctx.strokeStyle = color; ctx.lineWidth = 1.5; // Línea amarilla fina
        if(punteada) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.setLineDash([]);
    }

    function dibujarMira(x, y) {
        // Sombra negra para contraste
        ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke();
        
        // Círculo amarillo
        ctx.strokeStyle = COLOR_ZEISS; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke();

        // Cruz interior extendida
        ctx.beginPath();
        ctx.moveTo(x - 22, y); ctx.lineTo(x + 22, y);
        ctx.moveTo(x, y - 22); ctx.lineTo(x, y + 22);
        ctx.stroke();

        // Puntito central amarillo
        ctx.fillStyle = COLOR_ZEISS;
        ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();

        // Joysticks
        if (editando) {
            const offsetY = canvas.width * 0.08; 
            ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.strokeStyle = COLOR_ZEISS;
            ctx.beginPath(); ctx.moveTo(x, y + 22); ctx.lineTo(x, y + offsetY - 20); ctx.stroke(); ctx.setLineDash([]);

            let joyY = y + offsetY;
            ctx.fillStyle = "rgba(28, 28, 30, 0.85)"; ctx.beginPath(); ctx.arc(x, joyY, 24, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = COLOR_ZEISS; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, joyY, 24, 0, Math.PI * 2); ctx.stroke();
            
            ctx.fillStyle = COLOR_ZEISS; ctx.font = "20px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("✥", x, joyY);
        }
    }

    // =============== CÁLCULOS ===============

    function calcularMedidas() {
        if (!marcas.tarjetaIzq || !marcas.tarjetaDer || !marcas.nariz || !marcas.pupilaDer || !marcas.pupilaIzq || !marcas.baseDer || !marcas.baseIzq) return;

        const dxT = marcas.tarjetaDer.x - marcas.tarjetaIzq.x;
        const dyT = marcas.tarjetaDer.y - marcas.tarjetaIzq.y;
        factorEscala = TAMANO_TARJETA_MM / Math.sqrt(dxT * dxT + dyT * dyT);

        const dpDerMM = Math.abs(marcas.pupilaDer.x - marcas.nariz.x) * factorEscala;
        const dpIzqMM = Math.abs(marcas.pupilaIzq.x - marcas.nariz.x) * factorEscala;
        const altDerMM = Math.abs(marcas.baseDer.y - marcas.pupilaDer.y) * factorEscala;
        const altIzqMM = Math.abs(marcas.baseIzq.y - marcas.pupilaIzq.y) * factorEscala;

        // Actualizar Tabla estilo Zeiss
        document.getElementById('dpDer').innerText = dpDerMM.toFixed(1);
        document.getElementById('dpIzq').innerText = dpIzqMM.toFixed(1);
        document.getElementById('altDer').innerText = altDerMM.toFixed(1);
        document.getElementById('altIzq').innerText = altIzqMM.toFixed(1);
        document.getElementById('dpTotal').innerText = (dpDerMM + dpIzqMM).toFixed(1);

        seccionDatos.style.display = 'block';
        info.innerHTML = "<b>Modo Edición:</b> Arrastre los cursores inferiores (✥) para ajustar con precisión fina.";
    }

    // =============== CONTROLES ===============

    function obtenerCoordenadas(evento) {
        const rect = canvas.getBoundingClientRect();
        const ratioX = canvas.width / rect.width; 
        return {
            x: (evento.clientX - rect.left) * ratioX,
            y: (evento.clientY - rect.top) * (canvas.height / rect.height),
            ratio: ratioX 
        };
    }

    canvas.addEventListener('pointerdown', (evento) => {
        evento.preventDefault(); canvas.setPointerCapture(evento.pointerId); 
        const pos = obtenerCoordenadas(evento);
        const radioSeguro = 60 * pos.ratio; 

        if (editando) {
            const offsetY = canvas.width * 0.08; 
            for (let key in marcas) {
                let jX = marcas[key].x; let jY = marcas[key].y + offsetY;
                if (Math.hypot(jX - pos.x, jY - pos.y) < radioSeguro || Math.hypot(marcas[key].x - pos.x, marcas[key].y - pos.y) < radioSeguro) {
                    nodoArrastrado = key;
                    dragOffsetX = pos.x - marcas[key].x; dragOffsetY = pos.y - marcas[key].y;
                    return; 
                }
            }
        } else {
            if (pasoActual < ordenPasos.length) {
                marcas[ordenPasos[pasoActual]] = { x: pos.x, y: pos.y };
                pasoActual++;
                if (pasoActual < ordenPasos.length) info.innerHTML = `Paso ${pasoActual + 1}: <b>${descripciones[pasoActual]}</b>`;
                else editando = true; 
                dibujarTodo(); if (editando) calcularMedidas();
            }
        }
    });

    canvas.addEventListener('pointermove', (evento) => {
        if (!nodoArrastrado) return; 
        evento.preventDefault();
        const pos = obtenerCoordenadas(evento);
        marcas[nodoArrastrado].x = pos.x - dragOffsetX; marcas[nodoArrastrado].y = pos.y - dragOffsetY;
        dibujarTodo(); if (editando) calcularMedidas(); 
    });

    canvas.addEventListener('pointerup', (e) => { nodoArrastrado = null; canvas.releasePointerCapture(e.pointerId); });
    canvas.addEventListener('pointercancel', (e) => { nodoArrastrado = null; canvas.releasePointerCapture(e.pointerId); });

</script>
</body>
</html>
